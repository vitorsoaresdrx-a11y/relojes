<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fabricante Prime Relojes | Alta Relojería</title>
    <meta name="description" content="Descubra la colección exclusiva de relojes de lujo en Fabricante Prime Relojes. Rolex, Patek Philippe y más.">
    <link rel="stylesheet" href="styles.css?v=20">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Configuración de WhatsApp -->
    <script>
        window.whatsappPhone = "554791028539";
    </script>
</head>
<body>
    <!-- Top Banner -->
    <div class="top-banner">
        <i class="fas fa-check-circle"></i> 100% Auténtico Certificado
    </div>

    <!-- Header -->
    <header class="main-header" style="position: sticky; top: 0; z-index: 1000;">
        <div class="header-container" style="display: grid; grid-template-columns: 60px 1fr 60px; align-items: center; width: 100%;">
            <div class="header-left" style="display: flex; justify-content: flex-start;">
                <button id="cart-btn" aria-label="Carrito" style="position: relative;">
                    <i class="fas fa-shopping-bag"></i>
                    <span class="cart-count">0</span>
                </button>
            </div>
            
            <div class="header-logo" style="text-align: center;">
                <span style="font-family: var(--font-heading); font-size: 0.9rem; font-weight: 700; color: white; letter-spacing: 1px; text-transform: uppercase; white-space: nowrap;">VMAX RELOJES</span>
            </div>
            
            <!-- Espaço vazio para equilibrar o grid e manter o título no centro -->
            <div class="header-right" style="width: 60px;"></div>
        </div>
        
        <!-- Botão de Categoria "Pendurado" embaixo da barra -->
        <button id="open-category-modal" style="position: absolute; bottom: -29px; right: 20px; background-color: var(--primary); color: white; border: none; padding: 6px 15px; border-radius: 0 0 8px 8px; font-size: 0.75rem; font-weight: bold; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.1); font-family: var(--font-body); text-transform: uppercase; letter-spacing: 0.5px;">Categoría</button>
    </header>

    <!-- Hero Section with Video -->
    <section class="hero-video-section">
        <video autoplay loop muted playsinline preload="auto" class="hero-video">
            <source src="https://www.bobswatches.com/media/cms/homepage-dads-and-grads-desktop_1080p.mp4" type="video/mp4">
        </video>
        <div class="hero-overlay"></div>
        <div class="hero-content">
            <h3 class="hero-subtitle">EXCLUSIVOS</h3>
            <h1 class="hero-title">Relojes de Lujo</h1>
            <button class="hero-btn" id="open-category-modal">ELEGIR CATEGORÍA</button>
        </div>
    </section>

    <!-- Catalogo Section -->
    <section id="catalogo" style="padding-top: 30px;">
        <div class="container">
            <h2 class="section-title" id="current-category-title" style="margin-bottom: 40px;">Todos los Relojes</h2>
            
            <div class="products-grid" id="products-container">
                <!-- Products will be loaded here via JS -->
            </div>
        </div>
    </section>

    <!-- Modal for Categories -->
    <div id="category-modal" class="modal">
        <div class="modal-content" style="max-width: 400px; margin: 20% auto; padding: 30px;">
            <span class="close-category-modal close-modal" style="top: 10px; right: 15px;">&times;</span>
            <h3 style="margin-bottom: 20px; text-align: center; color: var(--black); font-family: var(--font-body); text-transform: uppercase; letter-spacing: 1px;">Categorías</h3>
            <div id="category-popup-list" style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                <!-- Buttons generated by JS -->
            </div>
        </div>
    </div>

    <!-- Modal for Watch Details -->
    <div id="watch-modal" class="modal">
        <div class="modal-content">
            <span class="close-modal">&times;</span>
            <div class="modal-body" id="modal-body-content">
                <!-- Loaded dynamically -->
            </div>
        </div>
    </div>

    <!-- Cart Drawer -->
    <div class="cart-overlay" id="cart-overlay"></div>
    <div class="cart-drawer" id="cart-drawer">
        <div class="cart-header">
            <h2>Su Carrito</h2>
            <button class="close-cart" id="close-cart-btn"><i class="fas fa-times"></i></button>
        </div>
        <div class="cart-items" id="cart-items-container">
            <!-- Cart items loaded via JS -->
            <div class="empty-cart-msg">Su carrito está vacío.</div>
        </div>
        <div class="cart-footer">
            <div class="cart-total-row">
                <span>Total</span>
                <strong id="cart-total-price">R$ 0,00</strong>
            </div>
            <button class="btn-checkout" id="checkout-btn">
                <i class="fab fa-whatsapp"></i> Finalizar Compra
            </button>
        </div>
    </div>

    <!-- Scripts -->
    <script src="data.js"></script>
    <script src="bobs_data.js?v=11"></script>
    <script src="script.js?v=15"></script>
</body>
</html>
